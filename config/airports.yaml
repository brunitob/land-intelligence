# V1: SOLO estos tres aeropuertos. No agregar otros.
airports:
  - code: BRC
    name: "San Carlos de Bariloche"
    region: bariloche
    latitude: -41.1512
    longitude: -71.1578
    enabled: true
  - code: CPC
    name: "Chapelco - Aviador Carlos Campos"
    region: chapelco
    latitude: -40.0754
    longitude: -71.1373
    enabled: true
  - code: EQS
    name: "Esquel"
    region: esquel
    latitude: -42.9080
    longitude: -71.1395
    enabled: true

geography:
  max_drive_minutes: 150         # tiempo de manejo, NO distancia en línea recta
  # Polígonos para el mapa. La API pública de OpenRouteService no da isócronas en auto de más de 60 min:
  # la pertenencia al radio de 150 min se calcula por propiedad con la matriz de tiempos.
  isochrone_minutes: [30, 60]
  routing_provider: openrouteservice
