[project]
name = "patagonia-land"
version = "0.1.0"
description = "Patagonia Land Intelligence: descubrimiento, extracción y monitoreo de terrenos de inmobiliarias locales (BRC/CPC/EQS)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dashboard = ["streamlit>=1.36", "pandas>=2.2", "pydeck>=0.9"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patagonia_land"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: Query() en defaults es idiomático en FastAPI. BLE001: worker/tests capturan todo a propósito.
ignore = ["B008", "BLE001"]
